<!DOCTYPE html>
<html lang="zh-CN">
<!-- 网页的头部信息，不会显示在页面上 -->
<head>
    <meta charset="UTF-8">
    <!-- 网页标题，会显示在浏览器标签上 -->
    <title>我的第一个GitHub网页</title>
    <!-- 简单的样式，让文字居中、变大 -->
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial, 微软雅黑;
        }
        h1 {
            color: #2c3e50;
            font-size: 40px;
        }
    </style>
</head>
<!-- 网页的主体内容，会显示在页面上 -->
<body>
    <h1>你好！这是我的第一个GitHub网页 🎉</h1>
    <p>我成功用GitHub Pages搭建了自己的网页！</p>
</body>
</html>
